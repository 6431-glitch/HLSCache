# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Quality Assurance

on:
  pull_request:
    branches: ["release/*"]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  targeted-validation:
    if: github.event_name != 'schedule'
    runs-on: MBP-2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Targeted regression filters
        run: |
          swift test --filter readinessGate_fixtureMode
          swift test --filter proxyCacheCoordinator_pluginMigration_forcedRecacheReasons_logTelemetryAndInvalidate
          swift test --filter proxyCacheCoordinator_streamingServe_authenticatedEncryptAtRest_tamperedCache_offlineFallbackDisabled_throwsWithoutNetwork
      - name: HLS-84 readiness gate (fixture minimum)
        run: |
          swift Scripts/check_hls84_readiness_gate.swift \
            --mode minimum \
            --format text \
            --fixture-file Scripts/fixtures/hls84_readiness_gate.minimum.json

  periodic-full-suite:
    if: github.event_name == 'schedule'
    runs-on: MBP-2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Full Swift test suite
        run: swift test -v
      - name: HLS-84 readiness gate (fixture final)
        run: |
          swift Scripts/check_hls84_readiness_gate.swift \
            --mode final \
            --format text \
            --fixture-file Scripts/fixtures/hls84_readiness_gate.final.json
