# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Quality Assurance

on:
  pull_request:
    branches: [ "release/*" ]

jobs:
  build:

    runs-on: MBP-2

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
